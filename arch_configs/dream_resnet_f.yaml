!!omap
- architecture: !!omap
  - type: resnet
  - target: keypoints
  - full_decoder: true
  - input_heads:
    - image_rgb
  - output_heads:
    - keypoints
  - image_normalization: !!omap
    - mean: [0.485, 0.456, 0.406]
    - stdev: [0.229, 0.224, 0.225]
  - loss: !!omap
    - type: mse
- training: !!omap
  - config: !!omap
    - image_preprocessing: shrink-and-crop
    - net_input_resolution: [400, 400]
