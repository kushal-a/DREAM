!!omap
# Do not change order or format of the config file
- data_path: !!omap 
  - dataset_path: ./data # WRT root of dataset
  - dataset_type: real # Choose from [real, synth]
  - real: !!omap 
    - cam: 3cam_realsense # Choose from [3cam_azure, 3cam_kinect36, 3cam_reaalsense, orb]
  - synth: !!omap 
    - type: train_dr # Choose from [train_dr, test_photo, test_dr]
  - optical_flow_path: ./data_flow 

- manipulator: !!omap
  - name: panda
  - keypoints:
    - name: panda_link0
      friendly_name: Base
      ros_frame: panda_link0
    - name: panda_link2
      friendly_name: Joint2
      ros_frame: panda_link2
    - name: panda_link3
      friendly_name: Joint3
      ros_frame: panda_link3
    - name: panda_link4
      friendly_name: Joint4
      ros_frame: panda_link4
    - name: panda_link6
      friendly_name: Joint6
      ros_frame: panda_link6
    - name: panda_link7
      friendly_name: Joint7
      ros_frame: panda_link7
    - name: panda_hand
      friendly_name: Hand
      ros_frame: panda_hand

- architecture: !!omap
  - type: resnet
  - target: keypoints
  - full_decoder: True
  - input_heads:
    - image_rgb
  - output_heads:
    - keypoints
  - image_normalization: !!omap
    - mean: [0.485, 0.456, 0.406]
    - stdev: [0.229, 0.224, 0.225]
  - loss: !!omap
    - type: mse # No other alternative implemented yet
  - image_preprocessing: shrink-and-crop # Will be overwritten by training below
  - positions_normalization: !!omap
    - panda_synth_train_dr: !!omap
      - mean: [-0.2306, -0.6779, 92.8132]
      - max: [97.2833, 94.0721, 118.0434]
    - panda_synth_test_dr: !!omap
      - mean: [0.3133, -0.8090, 92.2983]
      - max: [95.7698, 92.9244, 107.9108]
    - panda_synth_test_photo: !!omap
      - mean: [0.0631, -0.4748, 92.236]
      - max: [92.1251, 86.6405, 107.7391]
    - panda-3cam_azure: !!omap
      - mean: [-0.0688, -0.0357, 0.8660]
      - max: [0.5541, 0.5380, 0.4474]
    - panda-3cam_realsense: !!omap
      - mean: [0.0880, 0.0033, 1.2756]
      - max: [0.4982, 0.5187, 0.4986]
    - panda-3cam_kinect36: !!omap
      - mean: [0.1995, -0.0179, 1.1764]
      - max: [0.4776, 0.4056, 0.5615]
    - panda-orb: !!omap
      - mean: [-0.0160, -0.0508, 1.3116]
      - max: [0.6622, 0.4992, 0.7672]

- training: !!omap 
  - config: !!omap 
    - epochs: 5
    - training_data_fraction: 0.8 # The remaining will be used for validation
    - validation_data_fraction: 0.2 # Will be overwritted according to above
    - batch_size: 2
    - data_augmentation : False # Will be Overwritten according to args
    - worker_size: 1
    - optimizer: !!omap
      - type: adam # Choose from [adam, sgd]
      - learning_rate: 0.0001
    - image_preprocessing: shrink-and-crop
    - image_raw_resolution: [640, 480] # Will be overwritten in code
    - net_input_resolution: [400, 400]
  - platform: dummy
  - results: !!omap
    - epochs_trained: 0

- posediff_config: ./PoseDiffExps/posediff/configs/default.yaml

- logging: !!omap 
  - verbose: False
  - save_results: True
  - output_dir: ./output
  